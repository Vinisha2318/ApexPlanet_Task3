
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <h2>WebHub</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#quiz">Quiz</a>
            <a href="#jokes">Jokes</a>
        </nav>
    </header>

    <!-- Home Section -->
    <section id="home" class="hero">
        <h1>Welcome to WebHub</h1>
        <p>Learn, Explore and Test Your Web Development Skills!</p>
        <a href="#quiz" class="btn">Start Quiz</a>
    </section>

    <!-- Quiz Section -->
    <section id="quiz" class="section">
        <h2>JavaScript Quiz</h2>
        <div class="quiz-box">
            <h3 id="question">Question will appear here</h3>

            <div id="options"></div>

            <p id="result"></p>

            <button id="nextBtn" onclick="nextQuestion()">
                Next Question
            </button>

            <p id="score"></p>
        </div>
    </section>

    <!-- API Section -->
    <section id="jokes" class="section">
        <h2>Random Joke Generator</h2>

        <div class="joke-box">
            <p id="joke">Click the button to get a joke!</p>

            <button onclick="getJoke()">Get New Joke</button>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 WebHub | Designed using HTML, CSS and JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
